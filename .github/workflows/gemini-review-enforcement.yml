name: Gemini Code Review Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  check-gemini-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Details
        id: pr_details
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            core.setOutput('pr_number', prNumber);
            core.setOutput('head_sha', pr.head.sha);
            
            // Check if PR modifies workflow files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const hasWorkflowChanges = files.some(file => 
              file.filename.startsWith('.github/workflows/')
            );
            
            core.setOutput('skip_check', hasWorkflowChanges ? 'true' : 'false');

      - name: Skip Check for Workflow Changes
        if: steps.pr_details.outputs.skip_check == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr_details.outputs.head_sha }}',
              state: 'success',
              context: 'Gemini Code Review',
              description: 'Skipped for workflow changes'
            });

      - name: Check Gemini Review Using GraphQL
        if: steps.pr_details.outputs.skip_check != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = ${{ steps.pr_details.outputs.pr_number }};
            const headSha = '${{ steps.pr_details.outputs.head_sha }}';
            
            // Use GraphQL to get review threads with resolution status
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        isCollapsed
                        comments(first: 1) {
                          nodes {
                            author {
                              login
                            }
                            body
                          }
                        }
                      }
                    }
                    comments(first: 100) {
                      nodes {
                        author {
                          login
                        }
                        body
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: prNumber
            };
            
            const result = await github.graphql(query, variables);
            const reviewThreads = result.repository.pullRequest.reviewThreads.nodes;
            const comments = result.repository.pullRequest.comments.nodes;
            
            console.log(`Found ${reviewThreads.length} review threads`);
            console.log(`Found ${comments.length} PR comments`);
            
            // Check if Gemini has posted a "Code Review" (not just summary)
            const hasGeminiCodeReview = comments.some(comment => 
              (comment.author.login.includes('gemini') || comment.author.login.includes('code-assist')) &&
              comment.body.includes('Code Review')
            );
            
            // Filter Gemini review threads
            const geminiThreads = reviewThreads.filter(thread => {
              const firstComment = thread.comments.nodes[0];
              return firstComment && 
                     (firstComment.author.login.includes('gemini') || 
                      firstComment.author.login.includes('code-assist'));
            });
            
            console.log(`Found ${geminiThreads.length} Gemini review threads`);
            
            // Check if Gemini has reviewed at all
            if (!hasGeminiCodeReview && geminiThreads.length === 0) {
              console.log('Waiting for Gemini Code Review...');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'pending',
                context: 'Gemini Code Review',
                description: 'Waiting for Gemini Code Review...'
              });
              core.setFailed('Gemini has not yet reviewed this PR');
              return;
            }
            
            // Check for unresolved Gemini threads
            const unresolvedThreads = geminiThreads.filter(thread => !thread.isResolved);
            
            console.log(`Found ${unresolvedThreads.length} unresolved Gemini threads`);
            
            if (unresolvedThreads.length > 0) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'pending',
                context: 'Gemini Code Review',
                description: `${unresolvedThreads.length} Gemini suggestion(s) need resolution`
              });
              core.setFailed(`${unresolvedThreads.length} Gemini suggestions are unresolved`);
              return;
            }
            
            // All checks passed!
            console.log('✓ All Gemini suggestions have been resolved!');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'success',
              context: 'Gemini Code Review',
              description: 'All Gemini suggestions resolved ✓'
            });