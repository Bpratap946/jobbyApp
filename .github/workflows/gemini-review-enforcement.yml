name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # Allow manual re-check by commenting /check-gemini
  workflow_dispatch:

jobs:
  check-gemini-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Number
        id: get_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            let prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            
            if (!prNumber) {
              console.log('Not a PR event');
              core.setOutput('skip', 'true');
              return;
            }
            
            core.setOutput('pr_number', prNumber);
            core.setOutput('skip', 'false');

      - name: Check Gemini Review Status
        if: steps.get_pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = ${{ steps.get_pr.outputs.pr_number }};
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const headSha = pr.head.sha;
            
            // Check if PR modifies workflow files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const hasWorkflowChanges = files.some(file => 
              file.filename.startsWith('.github/workflows/')
            );
            
            if (hasWorkflowChanges) {
              console.log('PR modifies workflow files - auto-approving');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'success',
                context: 'Gemini Code Review',
                description: 'Skipped for workflow changes'
              });
              return;
            }
            
            // Use GraphQL to get review threads with resolution status
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        comments(first: 10) {
                          nodes {
                            author {
                              login
                            }
                            body
                          }
                        }
                      }
                    }
                    comments(first: 100) {
                      nodes {
                        author {
                          login
                        }
                        body
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: prNumber
            });
            
            const reviewThreads = result.repository.pullRequest.reviewThreads.nodes;
            const comments = result.repository.pullRequest.comments.nodes;
            
            console.log(`Found ${reviewThreads.length} review threads`);
            console.log(`Found ${comments.length} PR comments`);
            
            // Filter Gemini comments
            const geminiComments = comments.filter(comment => 
              comment.author.login.includes('gemini') || 
              comment.author.login.includes('code-assist')
            );
            
            console.log(`Found ${geminiComments.length} Gemini comments`);
            
            // Check if Gemini has posted reviews
            const hasSummary = geminiComments.some(c => 
              c.body.includes('Summary of Changes')
            );
            
            const hasCodeReview = geminiComments.some(c => 
              c.body.includes('Code Review') && !c.body.includes('Summary of Changes')
            );
            
            // Filter Gemini review threads (inline code comments)
            const geminiThreads = reviewThreads.filter(thread => {
              const firstComment = thread.comments.nodes[0];
              return firstComment && 
                     (firstComment.author.login.includes('gemini') || 
                      firstComment.author.login.includes('code-assist'));
            });
            
            console.log(`Gemini threads: ${geminiThreads.length}`);
            console.log(`Has Summary: ${hasSummary}, Has Code Review: ${hasCodeReview}`);
            
            // Status logic
            let state, description;
            
            // Case 1: No Gemini activity at all
            if (!hasSummary && !hasCodeReview && geminiThreads.length === 0) {
              state = 'pending';
              description = 'Waiting for Gemini to review...';
              console.log('No Gemini activity detected');
            }
            // Case 2: Only summary, no code review yet
            else if (hasSummary && !hasCodeReview && geminiThreads.length === 0) {
              state = 'pending';
              description = 'Gemini is reviewing... please wait';
              console.log('Only summary posted, waiting for code review');
            }
            // Case 3: Code review posted with NO inline suggestions
            else if (hasCodeReview && geminiThreads.length === 0) {
              state = 'success';
              description = 'Gemini reviewed - no suggestions ✓';
              console.log('Code review posted with no suggestions');
            }
            // Case 4: Has inline suggestions
            else if (geminiThreads.length > 0) {
              const unresolvedThreads = geminiThreads.filter(t => !t.isResolved);
              const resolvedThreads = geminiThreads.filter(t => t.isResolved);
              
              console.log(`Resolved: ${resolvedThreads.length}, Unresolved: ${unresolvedThreads.length}`);
              
              if (unresolvedThreads.length > 0) {
                state = 'failure';
                description = `${unresolvedThreads.length} suggestion(s) need resolution`;
              } else {
                state = 'success';
                description = 'All suggestions resolved ✓';
              }
            }
            // Fallback
            else {
              state = 'pending';
              description = 'Checking Gemini review status...';
            }
            
            console.log(`Final status: ${state} - ${description}`);
            
            // Set the commit status
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: state,
              context: 'Gemini Code Review',
              description: description
            });
            
            // If there are unresolved threads, also comment on the PR
            if (state === 'failure') {
              const existingComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              
              const botComment = existingComments.data.find(c => 
                c.user.type === 'Bot' && 
                c.body.includes('Gemini suggestions need resolution')
              );
              
              if (!botComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `⚠️ **Gemini suggestions need resolution**\n\nPlease review and resolve all Gemini Code Assist suggestions before merging.\n\n- Apply suggestions you agree with by clicking "Commit suggestion"\n- Mark conversations as resolved for suggestions you don't want to apply\n\nOnce all conversations are resolved, add a comment (any comment) to re-trigger this check.`
                });
              }
            }