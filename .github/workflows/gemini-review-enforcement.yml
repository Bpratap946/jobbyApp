name: Gemini Code Review Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  check-gemini-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Details
        id: pr_details
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            core.setOutput('pr_number', prNumber);
            core.setOutput('head_sha', pr.head.sha);
            
            // Check if PR modifies workflow files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const hasWorkflowChanges = files.some(file => 
              file.filename.startsWith('.github/workflows/')
            );
            
            core.setOutput('skip_check', hasWorkflowChanges ? 'true' : 'false');

      - name: Skip Check for Workflow Changes
        if: steps.pr_details.outputs.skip_check == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr_details.outputs.head_sha }}',
              state: 'success',
              context: 'Gemini Code Review',
              description: 'Skipped for workflow changes'
            });

      - name: Wait and Check for Gemini Review
        if: steps.pr_details.outputs.skip_check != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = ${{ steps.pr_details.outputs.pr_number }};
            const headSha = '${{ steps.pr_details.outputs.head_sha }}';
            const maxRetries = 12; // Check for up to 12 times (6 minutes)
            const retryDelay = 30000; // 30 seconds between retries
            
            // Helper function to sleep
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            
            // Helper function to check for Gemini review
            async function checkGeminiReview() {
              const query = `
                query($owner: String!, $repo: String!, $prNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $prNumber) {
                      reviewThreads(first: 100) {
                        nodes {
                          isResolved
                          isCollapsed
                          comments(first: 1) {
                            nodes {
                              author {
                                login
                              }
                              body
                            }
                          }
                        }
                      }
                      comments(first: 100) {
                        nodes {
                          author {
                            login
                          }
                          body
                          createdAt
                        }
                      }
                    }
                  }
                }
              `;
              
              const variables = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                prNumber: prNumber
              };
              
              const result = await github.graphql(query, variables);
              const reviewThreads = result.repository.pullRequest.reviewThreads.nodes;
              const comments = result.repository.pullRequest.comments.nodes;
              
              // Check if Gemini has posted "Code Review" (not just "Summary of Changes")
              const geminiComments = comments.filter(comment => 
                comment.author.login.includes('gemini') || 
                comment.author.login.includes('code-assist')
              );
              
              const hasSummary = geminiComments.some(comment => 
                comment.body.includes('Summary of Changes')
              );
              
              const hasCodeReview = geminiComments.some(comment => 
                comment.body.includes('Code Review') &&
                !comment.body.includes('Summary of Changes')
              );
              
              // Filter Gemini review threads
              const geminiThreads = reviewThreads.filter(thread => {
                const firstComment = thread.comments.nodes[0];
                return firstComment && 
                       (firstComment.author.login.includes('gemini') || 
                        firstComment.author.login.includes('code-assist'));
              });
              
              return {
                hasSummary,
                hasCodeReview,
                geminiThreads,
                totalGeminiComments: geminiComments.length
              };
            }
            
            // Set initial pending status
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'pending',
              context: 'Gemini Code Review',
              description: 'Checking for Gemini Code Review...'
            });
            
            // Retry logic to wait for Code Review
            let reviewStatus = await checkGeminiReview();
            let retryCount = 0;
            
            // If we have summary but not code review yet, wait for it
            while (reviewStatus.hasSummary && !reviewStatus.hasCodeReview && reviewStatus.geminiThreads.length === 0 && retryCount < maxRetries) {
              console.log(`Attempt ${retryCount + 1}/${maxRetries}: Gemini posted summary, waiting for Code Review...`);
              
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'pending',
                context: 'Gemini Code Review',
                description: `Waiting for Gemini Code Review... (${retryCount + 1}/${maxRetries})`
              });
              
              await sleep(retryDelay);
              reviewStatus = await checkGeminiReview();
              retryCount++;
            }
            
            // Check final status
            console.log(`Gemini review status: ${JSON.stringify(reviewStatus)}`);
            
            // If still no code review after retries
            if (!reviewStatus.hasCodeReview && reviewStatus.geminiThreads.length === 0) {
              console.log('No Gemini Code Review found after waiting');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'pending',
                context: 'Gemini Code Review',
                description: 'Waiting for Gemini Code Review...'
              });
              core.setFailed('Gemini has not yet posted Code Review');
              return;
            }
            
            // Check for unresolved threads
            const unresolvedThreads = reviewStatus.geminiThreads.filter(thread => !thread.isResolved);
            
            console.log(`Found ${reviewStatus.geminiThreads.length} Gemini review threads`);
            console.log(`Found ${unresolvedThreads.length} unresolved threads`);
            
            if (unresolvedThreads.length > 0) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'failure',
                context: 'Gemini Code Review',
                description: `${unresolvedThreads.length} Gemini suggestion(s) need resolution`
              });
              core.setFailed(`${unresolvedThreads.length} Gemini suggestions are unresolved`);
              return;
            }
            
            // All checks passed!
            console.log('✓ All Gemini suggestions have been resolved!');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'success',
              context: 'Gemini Code Review',
              description: 'All Gemini suggestions resolved ✓'
            });